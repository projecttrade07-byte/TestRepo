<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f0">
  <title>Events | Gather</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/events.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/add-event.html" aria-label="Gather home"><span class="brand-mark">g.</span> gather</a>
    <nav aria-label="Main navigation">
      <a class="nav-link" href="/add-event.html">Create event</a>
      <a class="nav-link active" href="/events.html">Event list</a>
    </nav>
  </header>

  <main class="list-shell">
    <section class="list-heading">
      <div>
        <p class="eyebrow">THE GOOD THINGS AHEAD</p>
        <h1>On the calendar<span class="heading-dot">.</span></h1>
        <p class="intro-copy">All the moments worth showing up for, in one place.</p>
      </div>
      <a class="button button-primary create-link" href="/add-event.html">Add an event <span aria-hidden="true">↗</span></a>
    </section>

    <section class="events-section" aria-labelledby="events-title">
      <div class="section-bar">
        <h2 id="events-title">Your events</h2>
        <span id="event-count" class="event-count"></span>
      </div>
      <p id="list-message" class="list-message" role="status" aria-live="polite">Loading events…</p>
      <div id="events-list" class="events-list"></div>
    </section>
  </main>

  <footer class="site-footer"><span>Gather well.</span><span>One event at a time.</span></footer>
</body>
</html>
