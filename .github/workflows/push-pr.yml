#webhook based workflow to trigger on push events
on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "src/**"
      
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - "src/**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Run tests
        run: npm test          